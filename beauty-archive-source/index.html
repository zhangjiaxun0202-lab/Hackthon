er:1px dashed #ba9393;border-radius:8px;background:#f6eeeb;padding:24px;text-align:center}.upload .icon{width:34px;height:34px;color:var(--wine)}.checkrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}input[type=checkbox]{accent-color:var(--wine);width:18px;height:18px}.checkrow label{margin:0;flex:1}.actions{display:flex;gap:10px;margin-top:22px}.actions>*{flex:1}.toast{position:fixed;bottom:94px;left:50%;transform:translateX(-50%);padding:12px 19px;background:#32282c;color:white;border-radius:8px;font-size:12px;z-index:50;max-width:90%;width:max-content}.success{text-align:center;padding:22px 0}.success .seal{width:66px;height:66px;background:#e4ebe1;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;color:#526d4b;font-size:30px}.footnote{text-align:center;font-size:10px;color:#a79b95;margin-top:24px}.guide{border-left:2px solid #bd8d92;padding:1px 13px;margin:18px 0}.guide p{font-size:12px}.itemline{padding:15px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}.filterline{display:flex;gap:9px}.filterline select{min-width:0;flex:1;background:white;padding:9px;border:1px solid var(--line);border-radius:6px;font-size:12px}.heart{color:var(--wine)}@keyframes slide{from{transform:translateY(25px);opacity:0}to{transform:none;opacity:1}}@media(min-width:700px){.app{margin:25px auto;min-height:calc(100dvh - 50px);border-radius:14px;overflow:hidden}.nav{bottom:0}body:before{content:"BEAUTY ARCHIVE / INTERACTIVE PROTOTYPE";position:fixed;left:28px;bottom:28px;writing-mode:vertical-rl;font-size:10px;letter-spacing:3px;color:#a59991}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:480px){.hero h2{font-size:25px}.hero p{max-width:210px}}.hero-art{transform:rotate(-12deg) scale(.8);transform-origin:bottom right;bottom:-22px}.hero h2{max-width:290px}</style></head><body><div class="app"><header><div><div class="brand">beauty archive<span style="color:#9d586b">.</span></div><div class="eyebrow" style="font-size:8px;margin-top:3px">A little more you, every day</div></div><button class="avatar" aria-label="打开我的页面" onclick="go('me')">A</button></header><main id="main"></main><nav class="nav" aria-label="主导航" id="nav"></nav></div><div id="modal"></div><div id="toast" role="status"></div><script>
const icons={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3z',book:'M4 3h6v18H4z M14 3h6v18h-6z',identity:'M12 3c5 0 8 4 8 9s-3 9-8 9-8-4-8-9 3-9 8-9z M8 10h.01 M16 10h.01 M9 15q3 3 6 0',people:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3 M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M17 3a4 4 0 0 1 0 8 M22 21v-3a4 4 0 0 0-3-4',me:'M20 21v-2a7 7 0 0 0-14 0v2 M13 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8',camera:'M3 6h5l2-3h4l2 3h5v15H3z M16 13a4 4 0 1 0-8 0 4 4 0 0 0 8 0',plus:'M12 4v16 M4 12h16',pen:'m4 16 12-12 4 4L8 20H4z M14 6l4 4'};
const ico=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[n]||icons.plus}"/></svg>`;
const initial={points:180,products:[{id:1,brand:'YSL BEAUTY',name:'水光唇膏',shade:'#07 Rosewood',cat:'唇部',color:'#a65c69',uses:42},{id:2,brand:'NARS',name:'柔雾腮红',shade:'Dolce Vita',cat:'腮红',color:'#b77d78',uses:28},{id:3,brand:'LANCÔME',name:'大地四色眼影',shade:'暖棕日常盘',cat:'眼妆',color:'#8f6e59',uses:19},{id:4,brand:'GIORGIO ARMANI',name:'丝光唇釉',shade:'#206 赤茶',cat:'唇部',color:'#8c4642',uses:12}],logs:[{name:'秋日通勤妆',style:'温柔日常',ids:[1,2,3],date:'10月12日'}],follow:[],profile:{skin:'暖调肤色',face:'方圆脸',style:'日常通勤'}};
let state;try{state=JSON.parse(localStorage.getItem('beauty-archive-v1'))||structuredClone(initial)}catch{state=structuredClone(initial)}let page='home',tab='产品',category='全部',query='',filter='全部',tone='全部',selected=[],newPhoto='',uploadURL='';
const save=()=>{try{localStorage.setItem('beauty-archive-v1',JSON.stringify(state))}catch{toast('当前浏览器未能保存，离开页面后可能丢失进度')}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){document.getElementById('toast').innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(window.tt);window.tt=setTimeout(()=>document.getElementById('toast').innerHTML='',2600)}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}function closeModal(){document.getElementById('modal').innerHTML=''}function sheet(title,html){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row"><h2>${title}</h2><button class="close" aria-label="关闭" onclick="closeModal()">×</button></div>${html}</section></div>`;document.querySelector('.close').focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.sheet')){const nodes=[...document.querySelector('.sheet').querySelectorAll('button,input,select')].filter(x=>!x.disabled&&x.type!=='hidden');if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}}});
function art(p){return `<div class="prod-art ${p.cat==='腮红'?'powder':p.cat==='眼妆'?'eye':''}" style="--shade:${p.color}"><div class="object"></div><span class="mark">${p.brand}</span></div>`}function product(p){return `<button class="product" onclick="detail(${p.id})">${art(p)}<div class="prod-info"><div class="eyebrow" style="font-size:8px;letter-spacing:1px">${p.brand}</div><h3>${p.shade}</h3><div class="muted">${p.name} · 使用 ${p.uses} 次</div></div></button>`}
function growth(){return `<div class="card growth"><div class="row"><div><span class="eyebrow">BEAUTY GROWTH</span><h3 style="margin-top:4px">Lv. ${7+Math.floor(state.points/100)} · SOFT 探索者</h3></div><span class="pill">${state.points} 积分</span></div><div class="bar"><i style="width:${state.points%100}%"></i></div><div class="row muted"><span>每一次尝试，都算数</span><span>距下一级 ${100-state.points%100} 分</span></div></div>`}

function render(){document.getElementById('nav').innerHTML=[['home','首页'],['book','我的图鉴'],['identity','美妆画像'],['people','达人匹配'],['me','我的']].map(([k,n])=>`<button class="${page===k?'active':''}" ${page===k?'aria-current="page"':''} onclick="go('${k}')">${ico(k)}${n}</button>`).join('');const m=document.getElementById('main');if(page==='home')m.innerHTML=`<div class="row"><div class="eyebrow">YOUR BEAUTY, YOUR STORY</div><span class="pill">交互演示</span></div><h1>早安，Amy <span style="font-size:22px">✳</span></h1><div class="muted">让每一件心爱之物，都有新的故事。</div><div class="hero"><div class="eyebrow" style="color:#8c6364">MAKE ROOM FOR DISCOVERY</div><h2 style="margin-top:12px">你的美，自成一派。</h2><p>从梳妆台开始，收藏你的美妆世界。</p><button class="primary" onclick="scan()">探索我的化妆台 ↗</button><div class="hero-art"><div class="lip"></div><div class="compact"></div></div></div><div class="quick"><button onclick="scan()">${ico('camera')}<span><strong>添加产品</strong><small>拍一拍，收进图鉴</small></span></button><button onclick="logForm()">${ico('pen')}<span><strong>记录今日妆容</strong><small>留住今天的好状态</small></span></button></div><section class="section">${growth()}</section><section class="section"><div class="row"><h2>最近的美妆记忆</h2><button class="textbtn" onclick="tab='妆容';go('book')">全部记录 ↗</button></div>${look(state.logs[0])}</section><section class="section"><div class="row"><h2>与你相似的美妆伙伴</h2><button class="textbtn" onclick="go('people')">去发现 ↗</button></div><div class="card row"><div class="portrait">Lin</div><div style="flex:1"><h3>林小暖</h3><div class="muted">方圆脸 · 暖调肤色 · 日常通勤</div></div><button class="textbtn" onclick="teacher(0)">认识她 →</button></div></section><div class="footnote">收藏 · 尝试 · 成为更了解自己的你</div>`;
else if(page==='book'){m.innerHTML=`<div class="eyebrow">MY BEAUTY COLLECTION</div><div class="row"><h1>我的美妆图鉴</h1><button class="primary" onclick="scan()">＋ 添加</button></div><div class="muted">${state.products.length} 件心爱好物，${state.logs.length} 段美妆记忆</div><div class="tabs">${['产品','妆容','关系网'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${tab==='产品'?`<input class="search" aria-label="搜索产品" placeholder="搜索品牌、产品或色号" value="${esc(query)}" oninput="query=this.value;productList()"><div class="tabs">${['全部','唇部','腮红','眼妆'].map(t=>`<button class="${category===t?'active':''}" onclick="category='${t}';render()">${t}</button>`).join('')}</div><div class="grid" id="products"></div>`:tab==='妆容'?`<button class="secondary wide" onclick="logForm()">＋ 记录一次新妆容</button><div class="section" style="display:grid;gap:12px">${state.logs.map(look).join('')}</div>`:`<div class="card"><h3>你的默契搭档</h3><p class="muted">连线来自已记录妆容中的共同使用。</p><div class="network"><svg viewBox="0 0 300 235"><path d="M150 55 65 170 245 170Z" fill="none" stroke="#c79b9c" stroke-width="2"/><text x="95" y="115" fill="#996d73" font-size="10">${pairs(1,2)} 次</text><text x="210" y="115" fill="#996d73" font-size="10">${pairs(1,3)} 次</text><text x="150" y="185" fill="#996d73" font-size="10">${pairs(2,3)} 次</text></svg><button class="node" style="top:15px;left:calc(50% - 39px)" onclick="detail(1)">Rosewood<br>水光唇膏</button><button class="node" style="bottom:30px;left:4%" onclick="detail(2)">Dolce Vita<br>柔雾腮红</button><button class="node" style="bottom:30px;right:4%" onclick="detail(3)">暖棕眼影<br>日常搭档</button></div><p class="muted">记录新的组合，让你的产品关系网慢慢生长。</p></div>`}`;if(tab==='产品')productList()}
else if(page==='identity')m.innerHTML=`<div class="eyebrow">BEAUTY IDENTITY</div><div class="row"><h1>美，自有坐标</h1><button class="textbtn" onclick="editProfile()">编辑画像</button></div><p class="muted">了解自己的偏好，也为新的尝试留白。</p><div class="profile section"><div class="eyebrow">AMY'S BEAUTY DNA</div><h2 style="margin:12px 0">Soft & Warm</h2><p>温柔有底色，日常有光泽。</p><div class="tags"><span class="pill">${esc(state.profile.face)}</span><span class="pill">${esc(state.profile.skin)}</span><span class="pill">${esc(state.profile.style)}</span></div><p class="muted">基础特征由你填写，可随时修改</p></div><div class="stat"><div><b>${state.products.length}</b><span>收藏产品</span></div><div><b>${state.logs.length}</b><span>妆容记录</span></div><div><b>${new Set(state.logs.map(x=>x.style)).size}</b><span>尝试风格</span></div></div><section class="section"><h2>我的色彩足迹</h2><div class="card section"><div class="color-map">${[['#b88a7e','裸色'],['#9a5255','玫瑰'],['#825144','红棕'],['#b6a6c5','蓝紫']].map(([c,n],i)=>`<div><i style="background:${c};${i===3?'opacity:.3;border:1px dashed #6a4f82':''}"></i><small>${n}</small></div>`).join('')}</div><div class="guide"><h3>偏爱温柔，也不设限</h3><p class="muted">当前演示收藏以暖色为主。蓝紫色仍是待探索区域，不需要购买新品也能记录新的风格尝试。</p></div></div></section><section class="section"><h2>真实尝试，留下偏好</h2>${['温柔日常','清透通勤','个性探索'].map(s=>{let n=state.logs.filter(l=>l.style===s).length;return `<div style="margin-top:15px" class="row"><span>${s}</span><span class="muted">${n} 次记录</span></div><div class="bar"><i style="width:${n/state.logs.length*100}%"></i></div>`}).join('')}</section><button class="primary wide section" onclick="go('people')">带着我的画像，寻找美妆伙伴 →</button>`;
else if(page==='people'){m.innerHTML=`<div class="eyebrow">FIND YOUR BEAUTY PEOPLE</div><h1>找到合拍的美妆伙伴</h1><p class="muted">相似的特征，更容易借鉴的美妆经验。</p><div class="card section"><div class="row"><h3>按你的关注点寻找</h3><button class="textbtn" onclick="editProfile()">我的画像 ↗</button></div><div class="filterline" style="margin-top:12px"><select aria-label="风格筛选" onchange="filter=this.value;render()">${['全部','日常通勤','个性彩妆'].map(v=>`<option ${filter===v?'selected':''}>${v}</option>`).join('')}</select><select aria-label="肤色筛选" onchange="tone=this.value;render()">${['全部','暖调肤色','冷调肤色'].map(v=>`<option ${tone===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="row section"><h2>从相似，到喜欢</h2><span class="muted">演示达人</span></div>${teachers.filter(t=>(filter==='全部'||t.style===filter)&&(tone==='全部'||t.skin===tone)).map(t=>teacherCard(t)).join('')||'<div class="empty">暂时没有符合条件的达人<br><button class="textbtn" onclick="tone=filter=\'全部\';render()">清除筛选</button></div>'}<div class="footnote">相似项依据填写的特征、风格与共有产品计算<br>所有达人及教程均为演示内容</div>`}
else m.innerHTML=`<div class="eyebrow">MY LITTLE BEAUTY WORLD</div><div class="row"><h1>你好，Amy</h1><div class="avatar">A</div></div><p class="muted">不是标准答案，是属于自己的美。</p><section class="section">${growth()}</section><div class="stat"><div><b>${state.products.length}</b><span>我的收藏</span></div><div><b>${state.logs.length}</b><span>妆容日记</span></div><div><b>${state.follow.length}</b><span>关注达人</span></div></div><button class="itemline" onclick="editProfile()">我的基础画像 <span style="float:right">›</span></button><button class="itemline" onclick="following()">我关注的美妆伙伴 <span style="float:right">›</span></button><button class="itemline" onclick="rewards()">成长徽章与积分 <span style="float:right">›</span></button><button class="itemline" onclick="about()">关于这个原型 <span style="float:right">›</span></button><button class="itemline muted" onclick="resetAsk()">重置演示数据 <span style="float:right">↺</span></button><div class="footnote">BEAUTY ARCHIVE<br>A little more you, every day.</div>`}
function productList(){const list=state.products.filter(p=>(category==='全部'||p.cat===category)&&[p.brand,p.name,p.shade].join(' ').toLowerCase().includes(query.toLowerCase()));document.getElementById('products').innerHTML=list.map(product).join('')||'<div class="empty" style="grid-column:1/-1">没有找到产品，试试其他关键词。</div>'}function pairs(a,b){return state.logs.filter(l=>l.ids.includes(a)&&l.ids.includes(b)).length}
function detail(id){const p=state.products.find(x=>x.id===id);sheet(p.shade,`${art(p)}<p class="eyebrow" style="margin-top:18px">${p.brand}</p><h3>${p.name}</h3><div class="stat"><div><b>${p.uses}</b><span>累计使用</span></div><div><b>${state.logs.filter(l=>l.ids.includes(id)).length}</b><span>已记录妆容</span></div></div><h3>常搭配产品</h3><div class="tags">${state.products.filter(x=>x.id!==id&&pairs(id,x.id)>0).map(x=>`<span class="pill">${x.shade} · ${pairs(id,x.id)}次</span>`).join('')||'<span class="muted">还没有搭配记录，试着记录一次妆容吧。</span>'}</div><button class="primary wide" onclick="logForm([${id}])">用它记录新妆容</button><p class="muted">产品名称、色号及历史使用次数为示例数据。</p>`)}
const additions=[{id:5,brand:'L’ORÉAL PARIS',name:'柔润唇膏',shade:'#129 玫瑰奶茶',cat:'唇部',color:'#b2757b',uses:0},{id:6,brand:'3CE',name:'单色腮红',shade:'Nude Peach',cat:'腮红',color:'#daa193',uses:0},{id:7,brand:'LANCÔME',name:'四色眼影',shade:'暮色玫瑰盘',cat:'眼妆',color:'#976e75',uses:0}];
function scan(){sheet('把心爱好物收进图鉴',`<p class="muted">01 拍摄产品 → 02 核对信息 → 03 加入图鉴</p><div class="upload">${ico('camera')}<h3>给化妆台拍张合照</h3><p class="muted">让包装与色号清晰可见</p><label class="secondary" for="photo">选择照片 / 拍摄</label><input id="photo" type="file" accept="image/*" style="display:none" onchange="previewPhoto(this)"><div id="photoPreview"></div></div><button class="primary wide" onclick="scanResult()">体验批量识别演示 →</button><p class="muted">此原型使用固定识别结果；照片仅用于本地预览，不上传，也不会进行真实识别。</p><button class="textbtn wide" onclick="manual()">也可以手动添加产品</button>`)}
function previewPhoto(input){if(!input.files[0])return;if(uploadURL)URL.revokeObjectURL(uploadURL);uploadURL=URL.createObjectURL(input.files[0]);document.getElementById('photoPreview').innerHTML=`<img alt="所选产品照片" src="${uploadURL}" style="width:100%;max-height:170px;object-fit:cover;border-radius:6px;margin-top:15px">`}
function scanResult(){sheet('发现 3 件美妆好物',`<span class="pill">模拟识别结果 · 请核对</span><p class="muted">色号需人工确认。已在图鉴中的产品会自动去重。</p>${additions.map((p,i)=>`<div class="checkrow"><input type="checkbox" id="add${i}" ${state.products.some(x=>x.id===p.id)?'disabled':'checked'}><label for="add${i}"><strong>${p.brand} · ${p.name}</strong><br>${p.shade}${state.products.some(x=>x.id===p.id)?' · 已在图鉴':''}</label><button class="textbtn" onclick="correct(${i})">修改</button></div>`).join('')}<div class="actions"><button class="secondary" onclick="scan()">重新选择</button><button class="primary" onclick="confirmProducts()">确认加入图鉴</button></div>`)}
function correct(i){const p=additions[i];sheet('核对产品信息',`<label>品牌</label><input id="brand" value="${esc(p.brand)}"><label>产品名称</label><input id="pname" value="${esc(p.name)}"><label>色号</label><input id="shade" value="${esc(p.shade)}"><button class="primary wide section" onclick="saveCorrection(${i})">保存并返回识别结果</button>`)}function saveCorrection(i){let a=['brand','pname','shade'].map(id=>document.getElementById(id).value.trim());if(a.some(x=>!x))return toast('请补全品牌、产品名称和色号');[additions[i].brand,additions[i].name,additions[i].shade]=a;scanResult()}
function confirmProducts(){let added=additions.filter((p,i)=>document.getElementById('add'+i).checked&&!state.products.some(x=>x.id===p.id));if(!added.length)return toast('请选择尚未添加的产品');state.products.push(...structuredClone(added));state.points+=added.length*5;save();closeModal();tab='产品';category='全部';query='';go('book');toast(`已加入 ${added.length} 件产品，成长积分 +${added.length*5}`)}
function manual(){sheet('手动添加产品',`<label>品牌</label><input id="brand" maxlength="40" placeholder="例如：YSL BEAUTY"><label>产品名称</label><input id="pname" maxlength="40" placeholder="例如：水光唇膏"><label>色号</label><input id="shade" maxlength="40" placeholder="例如：玫瑰豆沙"><label>品类</label><select id="pcat"><option>唇部</option><option>腮红</option><option>眼妆</option></select><button class="primary wide section" onclick="manualSave()">加入我的图鉴</button>`)}function manualSave(){let a=['brand','pname','shade'].map(id=>document.getElementById(id).value.trim());if(a.some(x=>!x))return toast('请补全产品信息');state.products.push({id:Date.now(),brand:a[0],name:a[1],shade:a[2],cat:document.getElementById('pcat').value,color:'#b5757b',uses:0});state.points+=5;save();closeModal();category='全部';query='';tab='产品';go('book');toast('新产品已加入图鉴，积分 +5')}
function logForm(ids=[1,2,3]){selected=[...ids];sheet('记录今天的美',`<p class="muted">选好使用的产品，留下一次真实的尝试。</p><label>妆容名称</label><input id="lookName" maxlength="40" value="我的日常好气色"><label>今天的风格</label><select id="lookStyle"><option>温柔日常</option><option>清透通勤</option><option>个性探索</option></select><label>本次使用的产品</label>${state.products.map(p=>`<div class="checkrow"><input id="use${p.id}" type="checkbox" ${ids.includes(p.id)?'checked':''}><label for="use${p.id}">${p.brand} · ${p.shade}</label></div>`).join('')}<button class="primary wide section" onclick="saveLook()">保存妆容，让图鉴成长</button><p class="muted">保存后同步增加产品使用次数、搭配次数与 20 积分。</p>`)}
function saveLook(){let name=document.getElementById('lookName').value.trim(),ids=state.products.filter(p=>document.getElementById('use'+p.id).checked).map(p=>p.id);if(!name||!ids.length)return toast('请输入妆容名称，并至少选择一件产品');let before=ids.flatMap((a,i)=>ids.slice(i+1).map(b=>pairs(a,b))),fresh=before.filter(x=>!x).length;state.logs.unshift({name,style:document.getElementById('lookStyle').value,ids,date:new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',timeZone:'Asia/Shanghai'}).format(new Date())});state.products.forEach(p=>{if(ids.includes(p.id))p.uses++});state.points+=20;save();render();sheet('新的美妆记忆，已收藏',`<div class="success"><div class="seal">✓</div><h2>一次尝试，三份成长</h2><p class="muted">${esc(name)}</p></div><div class="card"><p>✦ ${ids.length} 件产品的使用次数 +1</p><p>✦ ${ids.length*(ids.length-1)/2} 组搭配关系已更新${fresh?`，其中 ${fresh} 组新搭配`:''}</p><p>✦ Beauty Points +20，风格足迹已更新</p></div><button class="primary wide section" onclick="closeModal();tab='关系网';go('book')">查看我的产品关系网 →</button>`)}
const teachers=[{id:0,name:'林小暖',latin:'Lin',skin:'暖调肤色',face:'方圆脸',style:'日常通勤',common:[1,2,3],title:'方圆脸的温柔通勤妆',desc:'用腮红位置和柔和眼妆，保留自己的轮廓。'},{id:1,name:'周可可',latin:'Coco',skin:'暖调肤色',face:'圆脸',style:'日常通勤',common:[1,4],title:'十分钟的清透好气色',desc:'从手里的常用产品开始，练习轻盈叠加。'},{id:2,name:'阿紫 Violet',latin:'Vi',skin:'冷调肤色',face:'方圆脸',style:'个性彩妆',common:[3],title:'给日常眼妆加一点紫',desc:'保留熟悉的底色，试试一小处新的色彩。'}];
function matches(t){return [t.skin===state.profile.skin?'肤色倾向相同':null,t.face===state.profile.face?'脸型相同':null,t.style===state.profile.style?'风格偏好相同':null,t.common.some(id=>state.products.some(p=>p.id===id))?'拥有相同产品':null].filter(Boolean)}
function teacherCard(t){return `<article class="teacher"><div class="row"><div class="portrait">${t.latin}</div><div><h3>${t.name}</h3><div class="muted">${t.style} · 美妆创作者</div></div><div class="score">${matches(t).length}<small style="font:10px sans-serif"> /4</small></div></div><div class="tags">${matches(t).map(s=>`<span class="pill">${s}</span>`).join('')||'<span class="muted">探索不同的美妆经验</span>'}</div><div class="row" style="justify-content:space-between"><span class="muted">${t.face} · ${t.skin}</span><button class="primary" onclick="teacher(${t.id})">了解她 →</button></div></article>`}
function teacher(id){let t=teachers[id];sheet(t.name,`<div class="row section"><div class="portrait">${t.latin}</div><div><h3>${t.style} · 美妆创作者</h3><p class="muted">${t.face} · ${t.skin}</p></div><button class="secondary" onclick="toggleFollow(${id})">${state.follow.includes(id)?'已关注 ✓':'＋ 关注'}</button></div><div class="guide"><h3>与你的 ${matches(t).length} 项共同点</h3><p>${matches(t).join(' · ')||'不同风格，也值得探索'}</p></div><h3>你们共有的产品</h3><div class="tags">${t.common.filter(id=>state.products.some(p=>p.id===id)).map(id=>`<span class="pill">${state.products.find(p=>p.id===id).shade}</span>`).join('')}</div><div class="card section"><div class="eyebrow">LEARN WITH WHAT YOU OWN</div><h3 style="margin-top:8px">${t.title}</h3><p class="muted">${t.desc}</p><button class="textbtn" onclick="tutorial(${id})">查看分步教程 →</button></div><p class="muted">达人信息、共有产品及教程为虚构演示。</p>`)}function toggleFollow(id){state.follow=state.follow.includes(id)?state.follow.filter(x=>x!==id):[...state.follow,id];save();render();teacher(id)}
function tutorial(id){let t=teachers[id];sheet(t.title,`<p class="muted">分步教程 · 约 10 分钟 · 演示内容</p><div class="guide"><h3>01 / 轻薄打底</h3><p>少量多次上妆，保留自然肤感。</p></div><div class="guide"><h3>02 / 晕染眼妆</h3><p>用已有眼影的浅色铺底，在眼尾少量叠加深色，晕染边缘。</p></div><div class="guide"><h3>03 / 连接唇颊色彩</h3><p>选择色调相近的唇色与腮红，轻扫面颊，薄涂唇色。</p></div><div class="card"><h3>从我的图鉴里开始</h3><p class="muted">已选中你与达人共有的产品，可以在记录前调整。</p></div><button class="primary wide section" onclick="logForm([${t.common.filter(id=>state.products.some(p=>p.id===id)).join(',')}])">我也试一试 · 记录同款妆容</button>`)}
function editProfile(){sheet('我的基础画像',`<p class="muted">由你定义自己，匹配依据会随之更新。</p>${[['skin','肤色倾向',['暖调肤色','冷调肤色','中性肤色']],['face','脸型',['方圆脸','圆脸','长脸','鹅蛋脸']],['style','关注风格',['日常通勤','个性彩妆']]].map(([k,n,a])=>`<label>${n}</label><select id="${k}">${a.map(v=>`<option ${state.profile[k]===v?'selected':''}>${v}</option>`).join('')}</select>`).join('')}<button class="primary wide section" onclick="['skin','face','style'].forEach(k=>state.profile[k]=document.getElementById(k).value);save();closeModal();render();toast('画像已更新，达人相似项已重新计算')">保存画像</button>`)}
function following(){sheet('我关注的美妆伙伴',state.follow.length?state.follow.map(id=>teacherCard(teachers[id])).join(''):'<div class="empty">还没有关注的达人。<br><button class="textbtn" onclick="closeModal();go(\'people\')">寻找合拍的伙伴 →</button></div>')}
function rewards(){sheet('我的美妆成长',`${growth()}<div class="tags section"><span class="pill">✦ SOFT 温柔探索者 · 已解锁</span><span class="pill">${state.logs.some(l=>l.style==='个性探索')?'✦ BOLD 大胆尝试 · 已解锁':'BOLD · 记录一次个性探索妆容解锁'}</span></div><h3>积分如何获得</h3><p class="muted">添加产品 +5 / 件 · 记录妆容 +20 / 次</p><div class="card section"><h3>让成长成为奖励</h3><p class="muted">品牌试用、课程与线下体验为未来权益方向。此原型积分仅用于演示，不可兑换。</p></div>`)}
function about(){sheet('关于 Beauty Archive',`<p>收藏已有好物，记录真实尝试，找到合拍的美妆伙伴。</p><div class="guide"><p>演示 1：批量录入化妆台 → 核对 → 加入图鉴</p><p>演示 2：记录妆容 → 使用、关系、积分联动</p><p>演示 3：条件筛选 → 相似点 → 教程 → 跟练记录</p></div><p class="muted">数据保存在当前浏览器。无真实 AI 识别、品牌订单同步或达人账号连接。照片仅本地预览。清除浏览器数据会清除演示进度。</p>`)}function resetAsk(){sheet('重置演示数据？',`<p>这会清除当前浏览器中新增的产品、妆容与关注，并恢复初始示例。</p><div class="actions"><button class="secondary" onclick="closeModal()">保留记录</button><button class="primary" onclick="state=structuredClone(initial);save();closeModal();go('home');toast('已恢复初始演示')">重置</button></div>`)}render();
</script></body></html>
